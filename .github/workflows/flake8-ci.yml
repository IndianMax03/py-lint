name: Flake8 Linter Check

on:
  push:
    paths:
      - 'flake8_example/**'
  pull_request:
    paths:
      - 'flake8_example/**'

jobs:
  flake8-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8 Check
        run: flake8 flake8_example/ --config=flake8_example/.flake8
